server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Salud del propio contenedor de frontend (usado por el healthcheck de Docker)
    location /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # config.js se genera en runtime; evitar que el navegador lo cachee
    location = /config.js {
        add_header Cache-Control "no-store";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Compresión básica para los estáticos del panel
    gzip on;
    gzip_types text/css application/javascript application/json;
}
