<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gestor de Stock — Mundo Juguetes</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Karla:wght@400;500;700&display=swap');

  :root{
    --crema: #FFF8EE;
    --tinta: #2B2440;
    --naranja: #FF7A45;
    --turquesa: #1FA2A6;
    --amarillo: #FFC93C;
    --rosa: #FF5D8F;
    --linea: #E7DFCE;
    --ok-bg: #E4F5E9;
    --ok-fg: #1E7A44;
    --warn-bg: #FFF1DC;
    --warn-fg: #B5690A;
    --danger-bg: #FDE7E9;
    --danger-fg: #C6293D;
  }

  *{ box-sizing: border-box; }

  body{
    margin:0;
    background: var(--crema);
    color: var(--tinta);
    font-family: 'Karla', sans-serif;
    min-height:100vh;
  }

  header{
    padding: 28px 32px 22px;
    border-bottom: 3px solid var(--tinta);
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:10px;
  }

  header h1{
    font-family:'Fredoka', sans-serif;
    font-size: 28px;
    margin:0;
    letter-spacing: -0.02em;
  }
  header h1 span{ color: var(--naranja); }

  header p{
    margin:2px 0 0;
    font-size: 14px;
    color: #6b6280;
  }

  main{
    max-width: 980px;
    margin: 0 auto;
    padding: 28px 24px 80px;
  }

  .panel{
    background:#fff;
    border: 2px solid var(--tinta);
    border-radius: 18px;
    box-shadow: 5px 5px 0 var(--tinta);
    padding: 22px 24px;
    margin-bottom: 28px;
  }

  .panel h2{
    font-family:'Fredoka', sans-serif;
    font-size: 19px;
    margin: 0 0 16px;
    display:flex;
    align-items:center;
    gap:8px;
  }

  .campo-grid{
    display:grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 14px;
  }

  @media (max-width: 720px){
    .campo-grid{ grid-template-columns: 1fr 1fr; }
  }

  label{
    display:flex;
    flex-direction:column;
    font-size: 13px;
    font-weight: 700;
    color: #5b5270;
    gap: 5px;
  }

  input, select{
    font-family:'Karla', sans-serif;
    font-size: 15px;
    padding: 9px 11px;
    border-radius: 10px;
    border: 2px solid var(--linea);
    background: var(--crema);
    color: var(--tinta);
    font-weight: 500;
  }
  input:focus, select:focus{
    outline: none;
    border-color: var(--turquesa);
    background:#fff;
  }

  .acciones-form{
    margin-top: 16px;
    display:flex;
    gap: 10px;
    align-items:center;
  }

  button{
    font-family:'Fredoka', sans-serif;
    font-weight: 600;
    font-size: 14px;
    border-radius: 999px;
    border: 2px solid var(--tinta);
    padding: 10px 20px;
    cursor:pointer;
    transition: transform .08s ease;
  }
  button:active{ transform: translateY(1px); }

  .btn-primario{ background: var(--naranja); color:#fff; }
  .btn-secundario{ background:#fff; color:var(--tinta); }
  .btn-peligro{ background: var(--rosa); color:#fff; }
  .btn-chico{ padding: 6px 14px; font-size: 12px; border-width: 2px; }

  #mensaje-cancelar{
    font-size: 13px;
    color:#8a8299;
  }

  table{
    width:100%;
    border-collapse: collapse;
    font-size: 14px;
  }
  thead th{
    text-align:left;
    padding: 10px 8px;
    border-bottom: 2px solid var(--tinta);
    font-family:'Fredoka', sans-serif;
    font-size: 13px;
  }
  tbody td{
    padding: 11px 8px;
    border-bottom: 1px solid var(--linea);
    vertical-align: middle;
  }
  tbody tr:hover{ background: #FFFBF2; }

  .etiqueta{
    display:inline-block;
    padding: 3px 10px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 700;
  }
  .stock-ok{ background: var(--ok-bg); color: var(--ok-fg); }
  .stock-bajo{ background: var(--warn-bg); color: var(--warn-fg); }

  .col-acciones{ display:flex; gap:6px; }

  .estado{
    padding: 10px 14px;
    border-radius: 12px;
    font-size: 14px;
    font-weight: 600;
    margin-bottom: 16px;
    display:none;
  }
  .estado.ok{ display:block; background: var(--ok-bg); color: var(--ok-fg); }
  .estado.error{ display:block; background: var(--danger-bg); color: var(--danger-fg); }

  .vacio{
    text-align:center;
    padding: 30px 10px;
    color: #8a8299;
    font-size: 14px;
  }

  footer{
    text-align:center;
    font-size: 12px;
    color:#a89fbb;
    padding: 10px 0 30px;
  }
</style>
</head>
<body>

<header>
  <div>
    <h1>Mundo Juguetes <span>· Stock</span></h1>
    <p>Panel interno de control de inventario — CRUD de Producto (AE1)</p>
  </div>
  <div>
    <span id="indicador-conexion" class="etiqueta stock-bajo">Verificando API…</span>
  </div>
</header>

<main>

  <div id="estado-global" class="estado"></div>

  <section class="panel">
    <h2 id="titulo-form">➕ Nuevo producto</h2>
    <form id="form-producto">
      <input type="hidden" id="id_producto" value="">
      <div class="campo-grid">
        <label>Nombre
          <input type="text" id="nombre" required maxlength="120" placeholder="Ej: Muñeca Bebota">
        </label>
        <label>Marca
          <input type="text" id="marca" maxlength="80" placeholder="Ej: Playkids">
        </label>
        <label>Categoría
          <input type="text" id="categoria" maxlength="60" placeholder="Ej: Peluches">
        </label>
        <label>Precio de venta ($)
          <input type="number" id="precio_venta" step="0.01" min="0" required placeholder="0.00">
        </label>
        <label>Stock actual
          <input type="number" id="stock_actual" min="0" required placeholder="0">
        </label>
        <label>Stock mínimo
          <input type="number" id="stock_minimo" min="0" required placeholder="0">
        </label>
      </div>
      <div class="acciones-form">
        <button type="submit" class="btn-primario" id="btn-guardar">Guardar producto</button>
        <button type="button" class="btn-secundario" id="btn-cancelar" style="display:none;">Cancelar edición</button>
        <span id="mensaje-cancelar"></span>
      </div>
    </form>
  </section>

  <section class="panel">
    <h2>📦 Inventario</h2>
    <table>
      <thead>
        <tr>
          <th>ID</th>
          <th>Nombre</th>
          <th>Marca</th>
          <th>Categoría</th>
          <th>Precio</th>
          <th>Stock</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="tabla-productos">
        <tr><td colspan="7" class="vacio">Cargando productos…</td></tr>
      </tbody>
    </table>
  </section>

</main>

<footer>Sistema de Gestión de Stock — Juguetería · Actividad Evaluativa 1</footer>

<script src="app.js"></script>
</body>
</html>
