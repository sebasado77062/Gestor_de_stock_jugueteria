services:
  redis:
    image: redis:7-alpine
    container_name: jugueteria-redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: jugueteria-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-admin}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-admin123}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  auth:
    build:
      context: ./services/auth
    container_name: jugueteria-auth
    restart: unless-stopped
    environment:
      AUTH_SECRET_KEY: ${AUTH_SECRET_KEY:?Definí AUTH_SECRET_KEY en .env (ver .env.example)}
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: ${AUTH_DATABASE_URL:-sqlite:////app/data/auth.db}
      AUTH_ADMIN_EMAIL: ${AUTH_ADMIN_EMAIL:-}
      AUTH_ADMIN_PASSWORD: ${AUTH_ADMIN_PASSWORD:-}
      HABILITAR_USUARIOS_PRUEBA: ${HABILITAR_USUARIOS_PRUEBA:-true}
      PRUEBA_ADMIN_EMAIL: ${PRUEBA_ADMIN_EMAIL:-admin@test.com}
      PRUEBA_ADMIN_PASSWORD: ${PRUEBA_ADMIN_PASSWORD:-admin12345}
      PRUEBA_EMPLEADO_EMAIL: ${PRUEBA_EMPLEADO_EMAIL:-empleado@test.com}
      PRUEBA_EMPLEADO_PASSWORD: ${PRUEBA_EMPLEADO_PASSWORD:-empleado123}
    volumes:
      - auth_data:/app/data
    ports:
      - "${AUTH_PORT:-8001}:8001"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  productos:
    build:
      context: ./services/productos
    container_name: jugueteria-productos
    restart: unless-stopped
    environment:
      DATABASE_URL: ${PRODUCTOS_DATABASE_URL:-sqlite:////app/data/jugueteria.db}
      HABILITAR_SEED_ENDPOINT: ${HABILITAR_SEED_ENDPOINT:-true}
      AUTH_SECRET_KEY: ${AUTH_SECRET_KEY:?Definí AUTH_SECRET_KEY en .env (ver .env.example)}
      REDIS_URL: redis://redis:6379/0
    volumes:
      - productos_data:/app/data
    ports:
      - "${PRODUCTOS_PORT:-8000}:8000"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  movimientos:
    build:
      context: ./services/movimientos
    container_name: jugueteria-movimientos
    restart: unless-stopped
    environment:
      DATABASE_URL: ${MOVIMIENTOS_DATABASE_URL:-sqlite:////app/data/movimientos.db}
      PRODUCTOS_SERVICE_URL: http://productos:8000
      AUTH_SECRET_KEY: ${AUTH_SECRET_KEY:?Definí AUTH_SECRET_KEY en .env (ver .env.example)}
      REDIS_URL: redis://redis:6379/0
      RABBITMQ_URL: amqp://${RABBITMQ_DEFAULT_USER:-admin}:${RABBITMQ_DEFAULT_PASS:-admin123}@rabbitmq:5672/
    volumes:
      - movimientos_data:/app/data
    ports:
      - "${MOVIMIENTOS_PORT:-8002}:8000"
    depends_on:
      productos:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  worker-alertas:
    build:
      context: ./services/worker-alertas
    container_name: jugueteria-worker-alertas
    restart: unless-stopped
    environment:
      PRODUCTOS_SERVICE_URL: http://productos:8000
      RABBITMQ_URL: amqp://${RABBITMQ_DEFAULT_USER:-admin}:${RABBITMQ_DEFAULT_PASS:-admin123}@rabbitmq:5672/
    volumes:
      - alertas_data:/app/data
    depends_on:
      productos:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      # No es un servicio HTTP: no tiene healthcheck propio, se verifica
      # por logs (docker compose logs -f worker-alertas).

  frontend:
    build:
      context: ./frontend
    container_name: jugueteria-frontend
    restart: unless-stopped
    environment:
      PRODUCTOS_API_URL: ${PRODUCTOS_API_URL:-http://localhost:8000}
      AUTH_API_URL: ${AUTH_API_URL:-http://localhost:8001}
      MOVIMIENTOS_API_URL: ${MOVIMIENTOS_API_URL:-http://localhost:8002}
      HABILITAR_USUARIOS_PRUEBA: ${HABILITAR_USUARIOS_PRUEBA:-true}
      PRUEBA_ADMIN_EMAIL: ${PRUEBA_ADMIN_EMAIL:-admin@test.com}
      PRUEBA_ADMIN_PASSWORD: ${PRUEBA_ADMIN_PASSWORD:-admin12345}
      PRUEBA_EMPLEADO_EMAIL: ${PRUEBA_EMPLEADO_EMAIL:-empleado@test.com}
      PRUEBA_EMPLEADO_PASSWORD: ${PRUEBA_EMPLEADO_PASSWORD:-empleado123}
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      productos:
        condition: service_healthy
      movimientos:
        condition: service_healthy
      auth:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

volumes:
  productos_data:
  movimientos_data:
  auth_data:
  redis_data:
  rabbitmq_data:
  alertas_data: